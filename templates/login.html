<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QuizMaster</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #171b35, #292454, #49358b);
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
        }

        .auth-card {
            background: #ffffff;
            padding: 42px 38px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .brand {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #252747;
            margin-bottom: 28px;
        }

        .brand span {
            color: #7952df;
        }

        .welcome-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #f0ebff;
            font-size: 30px;
        }

        h2 {
            text-align: center;
            font-weight: 750;
            color: #222442;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #85859a;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #34344f;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #e1e1eb;
            border-radius: 10px;
            outline: none;
            margin-bottom: 20px;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #7952df;
            box-shadow: 0 0 0 3px rgba(121, 82, 223, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7952df, #6240c4);
            color: white;
            font-size: 16px;
            font-weight: 650;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(121, 82, 223, 0.3);
        }

        .bottom-text {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 0;
            color: #77778c;
            font-size: 14px;
        }

        .bottom-text a {
            color: #7952df;
            font-weight: 700;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 23px;
            }
        }
    </style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="brand">Quiz<span>Master</span></div>

        <div class="welcome-icon">👋</div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to continue your learning journey.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login to Account →</button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

    </div>
</div>

</body>
</html>
